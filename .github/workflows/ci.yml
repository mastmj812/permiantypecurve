# CI: run the backend test suite (incl. the real-well golden baselines +
# the money test — tripwires for silent numeric drift) and the frontend
# typecheck + unit tests on every push/PR. The suite is pure-function (no
# database required), so this stays fast and dependency-light.
#
# eslint runs as a NON-BLOCKING `lint` job (continue-on-error): the repo
# carries known lint debt (83 errors / 12 warnings, incl. maplibre
# no-unnecessary-type-assertion false-positives that --fix breaks), tracked
# in https://github.com/mastmj812/permiantypecurve/issues/2. It's visible on
# every run but doesn't block merges. Drop continue-on-error once that debt
# is cleared to make lint a required check.
name: ci

on:
  push:
    branches: ["main", "novi-forecast-overlay"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      # constraints.txt pins the exact versions the dev image runs —
      # CI must test the same scipy/numpy the fits use, or a green CI
      # says nothing about the numbers the tool produces.
      - run: pip install -e ".[dev]" -c constraints.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Non-blocking: surfaces eslint debt on every run without turning trunk red.
  # Tracked in issue #2; drop continue-on-error to make it required once clear.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
