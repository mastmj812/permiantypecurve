[project]
name = "permian-backend"
version = "0.1.0"
description = "Permian Type Curve Tool — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "sqlalchemy>=2.0.34",
    "psycopg[binary]>=3.2.1",
    "alembic>=1.13.2",
    "geoalchemy2>=0.15.2",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "apscheduler>=3.10.4",
    "numpy>=2.1.1",
    "pandas>=2.2.2",
    "scipy>=1.14.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "python-multipart>=0.0.20",
    # Pure-Python shapefile reader (.shp + .dbf). No GDAL system deps.
    # Used by the deal-polygons upload endpoint to parse the user's
    # acreage shapefiles into PostGIS rows.
    "pyshp>=2.3",
    # CRS identification from the .prj sidecar. PostGIS does the
    # actual reprojection via ST_Transform; pyproj just tells us
    # which source EPSG to transform from.
    "pyproj>=3.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # bcrypt 4.1+ broke API compat with passlib 1.7.4: even short passwords
    # raise "password cannot be longer than 72 bytes". Pin to the 4.0.x
    # series until passlib ships a fix. Re-evaluate when passlib 1.8 lands.
    "bcrypt>=4.0,<4.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "black>=24.8.0",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "types-passlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
